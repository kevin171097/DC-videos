name: Build DC VIDEOS APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generar proyecto Android
        run: CI=1 npx expo prebuild --platform android

      - name: Incluir JavaScript dentro del APK (sin Metro)
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("android/app/build.gradle")
          s = p.read_text()
          if "project.ext.react" in s:
              s = re.sub(r"(?m)^project\\.ext\\.react\\s*=.*\\n", "", s)
          if re.search(r"react\\s*\\{", s):
              s = re.sub(r"(react\\s*\\{)", r"\\1\\n    debuggableVariants = []", s, count=1)
          else:
              s += "\\nreact {\\n    debuggableVariants = []\\n}\\n"
          p.write_text(s)
          print("Configuración React Native:")
          print(s)
          PY
          grep -n -A 8 'react {' android/app/build.gradle

      - name: Corregir versión Kotlin generada por Expo
        run: |
          echo "Versiones Kotlin antes del ajuste:"
          grep -RIn --exclude-dir=.gradle --exclude-dir=build '1.9.24' android || true
          grep -RIl --exclude-dir=.gradle --exclude-dir=build '1.9.24' android | xargs -r sed -i 's/1.9.24/1.9.25/g'
          echo "Versiones Kotlin después del ajuste:"
          grep -RIn --exclude-dir=.gradle --exclude-dir=build -E '1.9.24|1.9.25' android || true
          if grep -RIl --exclude-dir=.gradle --exclude-dir=build '1.9.24' android | grep -q .; then
            echo "ERROR: todavía queda una referencia a Kotlin 1.9.24"
            exit 1
          fi

      - name: Forzar Kotlin 1.9.25 en React Native y Gradle
        run: |
          if [ -f node_modules/react-native/gradle/libs.versions.toml ]; then
            sed -i 's/1.9.24/1.9.25/g' node_modules/react-native/gradle/libs.versions.toml
          fi
          sed -i "s#classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')#classpath('org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.25')#" android/build.gradle
          echo "=== VERSION KOTLIN EN CATALOGO REACT NATIVE ==="
          grep -n -i -C 2 kotlin node_modules/react-native/gradle/libs.versions.toml || true
          echo "=== PLUGIN KOTLIN CONFIGURADO ==="
          grep -n 'kotlin-gradle-plugin' android/build.gradle

      - name: Diagnosticar versiones Kotlin y Compose
        run: |
          echo "=== REFERENCIAS EN ARCHIVOS ANDROID Y NODE_MODULES ==="
          grep -RIn --exclude-dir=.gradle --exclude-dir=build --exclude='*.map' -E '1\\.9\\.24|1\\.9\\.25|1\\.5\\.15|kotlinCompilerExtensionVersion|kotlin-gradle-plugin|org.jetbrains.kotlin' android node_modules/expo-modules-core node_modules/expo node_modules/react-native 2>/dev/null | head -300 || true
          echo "=== android/build.gradle ==="
          sed -n '1,180p' android/build.gradle
          echo "=== android/settings.gradle ==="
          sed -n '1,180p' android/settings.gradle
          echo "=== expo-modules-core/android/build.gradle ==="
          sed -n '1,220p' node_modules/expo-modules-core/android/build.gradle 2>/dev/null || true
          echo "=== expo-modules-core/android/gradle.properties ==="
          cat node_modules/expo-modules-core/android/gradle.properties 2>/dev/null || true

      - name: Compilar APK de prueba
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verificar que el APK incluya el bundle JavaScript
        working-directory: android
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          unzip -l "$APK" | tee /tmp/apk-list.txt
          grep -q 'assets/index.android.bundle' /tmp/apk-list.txt || {
            echo "ERROR: el APK no contiene assets/index.android.bundle"
            exit 1
          }

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: DC-VIDEOS-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
